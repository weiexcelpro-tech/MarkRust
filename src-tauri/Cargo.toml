[package]
name = "markrust"
version = "1.1.6"
description = "MarkRust — Markdown editor powered by Rust + Tauri 2"
authors = ["Mr.Jin"]
edition = "2021"
rust-version = "1.77"

# Tauri 2 应用必须的 library crate（app crate 不能同时是 bin + lib）
[lib]
name = "markrust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 1: 文件 IO + 编码 + 监听 + ripgrep
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
notify = { version = "6", features = ["serde"] }
notify-debouncer-mini = "0.4"
chardetng = "0.1"
encoding_rs = "0.8"
trash = "5"
walkdir = "2"
glob = "0.3"
which = "7"
log = "0.4"
env_logger = "0.11"

# Phase 2: 窗口 + 菜单 + 对话框
uuid = { version = "1", features = ["v4", "serde"] }

# Phase 3: 剪贴板（shell/dialog 已在 Phase 0/2 引入）
tauri-plugin-clipboard-manager = "2"

# Phase 4: 原生模块替换（keytar → keyring）
keyring = "3"

# Phase 5: 偏好持久化 + 更新检查
reqwest = { version = "0.12", features = ["json"] }
semver = "1"

# v2.0: DOCX 导出 + 图片处理
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
docx-rs = "0.4"
base64 = "0.22"
image = "0.25"

# e2e 内容级测试：解包 DOCX（OOXML zip）读取 word/document.xml 做断言。
# 复用 docx-rs 已带入并锁定在 Cargo.lock 的 zip 8.x，不引入第二个版本。
[dev-dependencies]
zip = "8"

# v2.0: PDF 静默导出（WebView2 PrintToPdf，Windows only）
[target.'cfg(target_os = "windows")'.dependencies]
# e2e 修复：与 tauri/wry 2.12 实际解析的 webview2-com 0.39（windows-core 0.62）对齐，
# 否则 controller.CoreWebView2() 返回的 ICoreWebView2 与本地 Interface trait 跨 crate 不互认（E0599）
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Release builds MUST enable this feature so that tauri embeds frontend assets
# (frontendDist) and loads them via the custom protocol, instead of connecting
# to devUrl (localhost:1420). Without it, `cargo build --release` silently
# falls back to dev mode and the exe cannot start without a dev server.
#
# Usage: cargo build --release --features embed-frontend
# (npx tauri build / npx tauri build --no-bundle enables this automatically.)
embed-frontend = ["tauri/custom-protocol"]

# Only in release mode hide the console window (standard for Windows desktop apps)
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
